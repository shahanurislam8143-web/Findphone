<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Link - Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-color: #6366f1;
      --accent-glow: linear-gradient(135deg, #6366f1, #a855f7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    /* Top Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .lang-btn:active {
      transform: scale(0.95);
    }

    /* Glass Card */
    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Ad Banner */
    .ad-banner {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(239, 68, 68, 0.15));
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .ad-banner a {
      color: #fbbf24;
      text-decoration: none;
      font-weight: bold;
    }

    /* Main Box */
    .channel-box {
      text-align: center;
      padding: 10px 0;
    }

    .channel-icon {
      font-size: 40px;
      background: var(--accent-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .channel-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .channel-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Action Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent-glow);
      color: #fff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:active {
      transform: translateY(2px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
    }

    /* Admin Section */
    .admin-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a855f7;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--accent-color);
    }

    /* Modal Alert */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: #1e1b4b;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      width: 85%;
      max-width: 320px;
      text-align: center;
    }

    .modal p {
      margin: 16px 0;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header -->
    <div class="header-bar">
      <div style="font-weight: 700; font-size: 18px; letter-spacing: 0.5px;">⚡ NEXUS LINK</div>
      <button class="lang-btn" onclick="toggleLang()"><i class="fa-solid fa-globe"></i> <span id="langText">English</span></button>
    </div>

    <!-- Ad Banner -->
    <div class="ad-banner" id="adBox">
      🔥 <span id="adText">বিশেষ ছাড়! ৫০% ডিসকাউন্ট পেতে স্পন্সর ওয়েবসাইট দেখুন।</span> 
      <a href="#" id="adLink" target="_blank">[Visit]</a>
    </div>

    <!-- Join Verification Box -->
    <div class="glass-card channel-box">
      <div class="channel-icon"><i class="fa-solid fa-bullhorn"></i></div>
      <div class="channel-title" id="txtTitle">আমাদের চ্যানেলে যুক্ত হন</div>
      <div class="channel-desc" id="txtDesc">বটের সব সার্ভিস ব্যবহারের জন্য অফিসিয়াল চ্যানেলে জয়েন থাকা বাধ্যতামূলক।</div>
      
      <div class="btn-group">
        <a id="btnJoinChannel" href="https://t.me/nexuslink0" target="_blank" class="btn btn-secondary">
          <i class="fa-brands fa-telegram"></i> <span id="txtJoinBtn">Join Channel</span>
        </a>
        <button class="btn btn-primary" onclick="verifyJoin()">
          <i class="fa-solid fa-circle-check"></i> <span id="txtVerifyBtn">Verify Join & Access</span>
        </button>
      </div>
    </div>

    <!-- Admin Panel (Auto Visible for Admin UID) -->
    <div class="glass-card" id="adminPanel" style="display: none;">
      <div class="admin-title"><i class="fa-solid fa-user-shield"></i> Admin Settings</div>
      
      <div class="input-group">
        <label>bKash Number</label>
        <input type="text" id="admBkash">
      </div>
      <div class="input-group">
        <label>Nagad Number</label>
        <input type="text" id="admNagad">
      </div>
      <div class="input-group">
        <label>Required Channel (@username)</label>
        <input type="text" id="admChannel">
      </div>
      <div class="input-group">
        <label>Ad Text</label>
        <input type="text" id="admAdText">
      </div>
      <div class="input-group">
        <label>Ad Link</label>
        <input type="text" id="admAdLink">
      </div>

      <button class="btn btn-primary" style="margin-top: 10px;" onclick="saveAdminSettings()">
        <i class="fa-solid fa-floppy-disk"></i> Save Settings
      </button>
    </div>
  </div>

  <!-- Custom Alert Modal -->
  <div class="modal-overlay" id="customModal">
    <div class="modal">
      <i class="fa-solid fa-circle-info" style="font-size: 36px; color: #a855f7;"></i>
      <p id="modalMsg">ম্যাসেজ</p>
      <button class="btn btn-primary" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const userId = tg.initDataUnsafe?.user?.id || 7779071715; // default fallback
    let currentLang = 'bn';

    // Load initial app data
    async function loadAppData() {
      try {
        const res = await fetch(`/api/init-app/${userId}`);
        const data = await res.json();

        if (data.isApproved) {
          showAlert("অভিনন্দন! আপনি সফলভাবে অ্যাক্সেস পেয়েছেন।");
        }

        // Apply Settings
        if (data.appSettings) {
          const set = data.appSettings;
          document.getElementById('adText').innerText = set.bannerAdText || '';
          document.getElementById('adLink').href = set.bannerAdUrl || '#';
          document.getElementById('btnJoinChannel').href = set.channelLink || '#';
          
          // Populate Admin Inputs
          document.getElementById('admBkash').value = set.bkashNumber || '';
          document.getElementById('admNagad').value = set.nagadNumber || '';
          document.getElementById('admChannel').value = set.requiredChannel || '';
          document.getElementById('admAdText').value = set.bannerAdText || '';
          document.getElementById('admAdLink').value = set.bannerAdUrl || '';
        }

        if (data.isAdmin) {
          document.getElementById('adminPanel').style.display = 'block';
        }

      } catch (err) {
        console.error("Data load failed", err);
      }
    }

    async function verifyJoin() {
      try {
        const res = await fetch(`/api/check-join/${userId}`);
        const data = await res.json();
        if (data.joined) {
          showAlert("ভেরিফিকেশন সফল হয়েছে! আপনাকে ধন্যবাদ।");
        } else {
          showAlert("আপনি এখনো আমাদের চ্যানেলে জয়েন করেননি! দয়া করে চ্যানেলে যুক্ত হন।");
        }
      } catch (e) {
        showAlert("ভেরিফাই করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
      }
    }

    async function saveAdminSettings() {
      const payload = {
        adminId: userId,
        bkashNumber: document.getElementById('admBkash').value,
        nagadNumber: document.getElementById('admNagad').value,
        requiredChannel: document.getElementById('admChannel').value,
        bannerAdText: document.getElementById('admAdText').value,
        bannerAdUrl: document.getElementById('admAdLink').value
      };

      const res = await fetch('/api/admin/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        showAlert("অ্যাডমিন সেটিংস সফলভাবে সেভ হয়েছে!");
        loadAppData();
      }
    }

    function showAlert(msg) {
      document.getElementById('modalMsg').innerText = msg;
      document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('customModal').style.display = 'none';
    }

    function toggleLang() {
      currentLang = currentLang === 'bn' ? 'en' : 'bn';
      document.getElementById('langText').innerText = currentLang === 'bn' ? 'English' : 'বাংলা';
      
      if(currentLang === 'en') {
        document.getElementById('txtTitle').innerText = "Join Our Channel";
        document.getElementById('txtDesc').innerText = "Must join our official channel to use the features.";
        document.getElementById('txtJoinBtn').innerText = "Join Channel";
        document.getElementById('txtVerifyBtn').innerText = "Verify Join & Access";
      } else {
        document.getElementById('txtTitle').innerText = "আমাদের চ্যানেলে যুক্ত হন";
        document.getElementById('txtDesc').innerText = "বটের সব সার্ভিস ব্যবহারের জন্য অফিসিয়াল চ্যানেলে জয়েন থাকা বাধ্যতামূলক।";
        document.getElementById('txtJoinBtn').innerText = "Join Channel";
        document.getElementById('txtVerifyBtn').innerText = "Verify Join & Access";
      }
    }

    loadAppData();
  </script>
</body>
    </html>
